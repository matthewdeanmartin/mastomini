[project]
name = "mastomini-clienttests"
version = "0.1.0"
description = "Drives the mastomini desktop binary with real Mastodon clients"
requires-python = ">=3.11"
dependencies = [
    "Mastodon.py>=2.0",
    "pytest>=8",
    "requests>=2.31",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
