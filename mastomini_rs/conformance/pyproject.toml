[project]
name = "mastomini-conformance"
version = "0.1.0"
description = "mastodon_mock's Mastodon.py contract suite, run against the mastomini desktop binary"
requires-python = ">=3.11"
dependencies = [
    "Mastodon.py>=2.2.1",
    "httpx2>=2.4.0",
    "pytest>=8",
    "requests>=2.31",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
xfail_strict = true
