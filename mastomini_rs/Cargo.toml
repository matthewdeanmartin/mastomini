[package]
name = "mastomini_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "mastomini"
description = "A tiny, non-federating Mastodon-compatible server for one household, aimed at ESP32-S3"
license = "MIT"
build = "build.rs"

[lib]
name = "mastomini"

[[bin]]
name = "mastomini"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "mastomini-esp32"
path = "src/bin/esp32.rs"
required-features = ["esp32"]

[features]
default = ["desktop", "http2"]
# The desktop server: miniframework's connection loop with HTTPS (rustls).
desktop = ["miniframework/desktop-tls", "dep:fs2", "dep:ureq", "dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
esp32 = ["miniframework/esp32", "dep:esp-idf-svc", "dep:embuild", "bundled-web"]
# Transports (miniframework): HTTP and HTTPS are always built; `http2` adds
# HTTP/2, which browsers choose by ALPN (scripts/build-esp32.sh: HTTP2=1).
http2 = ["miniframework/http2"]
# Embed the household app (mastomini_ui); needs `make web` first.
bundled-web = []
# ESP32-P4 with an ESP32-C6 Wi-Fi companion (MASTOMINI_BOARD=p4).
board-p4 = []

[dependencies]
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
getrandom = "0.2"
crc32fast = "1.4"
unicode-segmentation = "1.12"
form_urlencoded = "1.2"
percent-encoding = "2.3"
# The HTTP(S) server, connection loop, board runner (Wi-Fi, setup network,
# SNTP, mDNS) and /metrics. gzip off: the app's assets are pre-compressed.
miniframework = { path = "../../microcontroller/miniframework/crates/miniframework", default-features = false, features = ["tls", "ops"] }
fs2 = { version = "0.4", optional = true }
log = "0.4"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
zeroize = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "=0.52.1", optional = true, features = ["experimental"] }

[build-dependencies]
embuild = { version = "0.33", optional = true, features = ["espidf"] }
# The build fingerprint (build.rs, scripts/firmware-version.py).
sha2 = "0.10"

# Property generators are host test tooling, never firmware dependencies.
[target.'cfg(not(target_os = "espidf"))'.dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.3"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }
bindings_header = "src/mdns_bindings.h"

# The ESP32-P4's Wi-Fi lives on an ESP32-C6 reached over SDIO (ESP-Hosted).
# Its dependencies only apply when the IDF target is esp32p4 (as nanacoin).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/p4-network"]
bindings_header = "src/p4_bindings.h"
